    <line x1="216" y1="140" x2="216" y2="372"/>
    <line x1="286" y1="140" x2="286" y2="372"/>
    <line x1="356" y1="140" x2="356" y2="372"/>
    <line x1="112" y1="360" x2="392" y2="150"/>
  </g>
</svg>
